<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>three-gis · 原生 HTML（全局脚本）</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1020;
        color: #e8ecf4;
        font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #app {
        position: absolute;
        inset: 0;
      }
      #hud {
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 10;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(10, 16, 32, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        pointer-events: none;
      }
      #hud b {
        color: #7fd1ff;
      }
      #hud code {
        color: #ffd479;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <b>three-gis</b> · 原生 HTML + <code>&lt;script src&gt;</code><br />
      全局变量 <code>ThreeGIS</code>，three 已内联进产物，无需另行引入<br />
      <span id="status">初始化中…</span>
    </div>

    <!-- 全局构建把 three 一起打进来了，页面只需要这一个 script -->
    <script src="../dist/three-gis.global.js"></script>
    <script src="./demo-boot.js"></script>
    <script>
      window.bootThreeGis(window.ThreeGIS);
    </script>
  </body>
</html>
